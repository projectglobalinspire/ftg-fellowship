<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Donor – FTG x GI</title><meta name="theme-color" content="#293f52"><link rel="icon" href="assets/icon-192.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="donor.css?v=1"><script defer src="donor.js?v=1"></script></head><body><main style="min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#f5f8fb"><section style="background:linear-gradient(145deg,#293f52,#176451);padding:8vw;color:#fff;display:flex;flex-direction:column;justify-content:center"><div class="donor-brand" style="border:0;padding:10px 14px;background:#fff;border-radius:14px;width:max-content;margin-bottom:35px"><img src="assets/ftg-logo.png" alt="FTG"><span>×</span><img src="assets/gi-logo.png" alt="GI"></div><span class="donor-eyebrow">IMPACT TRANSPARENCY</span><h1 data-login-title style="font-size:36px;max-width:600px;margin:12px 0"></h1><p data-login-copy style="color:#ffffffb5;line-height:1.7;max-width:600px"></p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;max-width:620px"><div style="background:#ffffff0e;border-radius:14px;padding:14px"><i class="fa-solid fa-wallet"></i><small style="display:block;margin-top:9px;color:#ffffffae">Funding</small></div><div style="background:#ffffff0e;border-radius:14px;padding:14px"><i class="fa-solid fa-chart-line"></i><small style="display:block;margin-top:9px;color:#ffffffae">SROI & ESG</small></div><div style="background:#ffffff0e;border-radius:14px;padding:14px"><i class="fa-solid fa-people-group"></i><small style="display:block;margin-top:9px;color:#ffffffae">Beneficiaries</small></div></div></section><section style="display:grid;place-items:center;padding:30px"><div class="donor-card" style="width:min(430px,100%);padding:30px"><div class="donor-language" style="width:max-content;margin-left:auto"><button data-lang="id">ID</button><button data-lang="en">EN</button></div><span class="donor-eyebrow">DONOR ACCESS</span><h2 style="font-size:24px;margin:10px 0 5px">Masuk / Sign in</h2><p style="font-size:10px;color:#708197;line-height:1.5">Gunakan email dan kode akses yang diberikan Fasil.<br>Use the email and access code provided by Fasil.</p><form id="donorLoginForm" style="display:grid;gap:9px;margin-top:20px"><label style="font-size:9px;font-weight:800">Email donor</label><input class="donor-input" id="donorEmail" type="email" required autocomplete="email" placeholder="donor@company.com"><label style="font-size:9px;font-weight:800">Kode akses / Access code</label><input class="donor-input" id="donorCode" type="password" required autocomplete="current-password" placeholder="••••••••"><p id="donorLoginStatus" style="min-height:14px;color:#dc2626;font-size:9px;margin:0"></p><button class="donor-button" type="submit">Masuk ke Portal</button></form><p style="font-size:8px;color:#94a3b8;text-align:center;margin-top:16px"><i class="fa-solid fa-shield-halved"></i> Akses terbatas sesuai program yang didukung.</p></div></section></main><style>@media(max-width:760px){main{grid-template-columns:1fr!important}main>section:first-child{display:none!important}}</style></body></html>
