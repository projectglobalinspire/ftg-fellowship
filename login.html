<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk – FTG x GI Fellowship</title>
  <meta name="theme-color" content="#2c3e50">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="responsive.css?v=31">
  <script src="ftg-config.js?v=30"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .5s ease both; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .shake { animation: shake .4s ease; }
    input:focus { border-color: #f97316 !important; }
  </style>
</head>
<body class="min-h-screen bg-[#2c3e50] flex items-center justify-center px-4 py-10">
  <div class="absolute inset-0 opacity-10 pointer-events-none overflow-hidden">
    <div class="w-[420px] h-[420px] rounded-full bg-[#f97316] absolute -right-32 -top-32"></div>
    <div class="w-[360px] h-[360px] rounded-full bg-[#8b5cf6] absolute -left-28 bottom-0"></div>
  </div>

  <div class="relative w-full max-w-md fade-up">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-3 bg-white/95 rounded-2xl px-5 py-3 mb-3">
        <img src="assets/ftg-logo.png" alt="FTG" class="h-9 w-auto">
        <span class="text-slate-300 text-lg font-thin">×</span>
        <img src="assets/gi-logo.png" alt="GI" class="h-8 w-auto">
      </div>
      <p class="login-kicker text-white/40 text-[10px] font-bold tracking-[0.3em] uppercase">Future Builders Fellowship 2026</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl p-7 shadow-2xl" id="loginCard">
      <div class="login-heading flex items-center justify-between mb-1">
        <h1 class="text-[#2c3e50] text-xl font-extrabold">Masuk ke Platform</h1>
        <span id="roleBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-[#f97316]/10 text-[#f97316]">MENTEE</span>
      </div>
      <p class="text-slate-500 text-sm mb-5" id="roleDesc">Masuk untuk melanjutkan perjalanan fellowship-mu.</p>

      <!-- Role toggle (Panitia masuk lewat tautan khusus, tidak ditampilkan) -->
      <div class="flex bg-slate-100 rounded-xl p-1 gap-1 mb-5" id="roleTabs">
        <button type="button" id="tabMentee" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white shadow text-[#2c3e50]">🎓 Mentee</button>
        <button type="button" id="tabMentor" class="flex-1 py-2 rounded-lg text-xs font-semibold text-slate-500">🧑‍🏫 Mentor</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <label class="text-slate-600 text-xs font-semibold block mb-1.5">Email</label>
        <div class="relative mb-4">
          <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
          <input id="email" type="email" required placeholder="nama@ftg.id"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm text-[#2c3e50] outline-none">
        </div>
        <label class="text-slate-600 text-xs font-semibold block mb-1.5">Password</label>
        <div class="relative mb-2">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
          <input id="password" type="password" required placeholder="••••••••"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-11 py-3 text-sm text-[#2c3e50] outline-none">
          <button type="button" id="togglePw" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-regular fa-eye"></i></button>
        </div>
        <button type="button" id="forgotPw" class="text-[#1a5f4f] text-xs font-semibold mb-3 hover:underline">Lupa password?</button>
        <p id="errMsg" class="text-[#ef4444] text-xs font-semibold mb-3 hidden"><i class="fa-solid fa-circle-exclamation mr-1"></i><span></span></p>

        <button type="submit" id="btnLogin"
          class="w-full bg-[#1a5f4f] hover:bg-[#155242] text-white text-sm font-bold py-3.5 rounded-xl mt-2 flex items-center justify-center gap-2">
          <span>Masuk</span> <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <form id="resetForm" class="hidden" autocomplete="off">
        <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-3 mb-4 text-xs text-emerald-800">
          Buat password baru untuk akunmu. Gunakan minimal 8 karakter.
        </div>
        <label class="text-slate-600 text-xs font-semibold block mb-1.5">Password baru</label>
        <input id="newPassword" type="password" minlength="8" required placeholder="Minimal 8 karakter"
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-[#2c3e50] outline-none mb-3">
        <label class="text-slate-600 text-xs font-semibold block mb-1.5">Ulangi password baru</label>
        <input id="confirmPassword" type="password" minlength="8" required placeholder="Ulangi password"
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-[#2c3e50] outline-none mb-3">
        <p id="resetMsg" class="text-xs font-semibold mb-3 hidden"></p>
        <button type="submit" id="btnReset" class="w-full bg-[#1a5f4f] text-white text-sm font-bold py-3.5 rounded-xl">Simpan Password Baru</button>
      </form>

    </div>

    <p id="connBadge" class="text-center mt-4 text-[10px] text-white/30"></p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var role = params.get('role') || location.hash.replace('#', '') || 'mentee';
      var sb = null;
      try {
        if (window.supabase && window.FTG_CONF && window.FTG_CONF.anonKey) {
          sb = window.supabase.createClient(window.FTG_CONF.url, window.FTG_CONF.anonKey);
        }
      } catch (e) {}
      document.getElementById('connBadge').textContent = sb ? '● Login aman Supabase Auth' : '○ Layanan login tidak tersedia';

      function homeFor(r) { return r === 'admin' ? 'admin-dashboard.html' : (r === 'mentor' ? 'mentor-dashboard.html' : 'mentee-dashboard.html'); }

      // Sesi hanya dianggap sah bila token Supabase masih aktif.
      if (sb) sb.auth.getSession().then(function (result) {
        if (!result.data.session) return;
        return sb.from('profiles').select('*').eq('id', result.data.session.user.id).maybeSingle().then(function (p) {
          if (p.data && p.data.status === 'active') success(p.data, result.data.session.user);
        });
      });

      var email = document.getElementById('email');
      var password = document.getElementById('password');
      var badge = document.getElementById('roleBadge');
      var desc = document.getElementById('roleDesc');
      var tabMentee = document.getElementById('tabMentee');
      var tabMentor = document.getElementById('tabMentor');
      var roleTabs = document.getElementById('roleTabs');
      var errMsg = document.getElementById('errMsg');

      function showPasswordRecovery() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('resetForm').classList.remove('hidden');
        document.getElementById('roleTabs').classList.add('hidden');
        badge.textContent = 'RESET PASSWORD';
        desc.textContent = 'Amankan kembali akun fellowship kamu.';
      }
      if (params.get('reset') === '1') showPasswordRecovery();
      if (sb) sb.auth.onAuthStateChange(function (event) { if (event === 'PASSWORD_RECOVERY') showPasswordRecovery(); });

      document.getElementById('resetForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var next = document.getElementById('newPassword').value;
        var confirm = document.getElementById('confirmPassword').value;
        var msg = document.getElementById('resetMsg');
        msg.classList.remove('hidden', 'text-[#ef4444]', 'text-[#16a34a]');
        if (next.length < 8 || next !== confirm) { msg.classList.add('text-[#ef4444]'); msg.textContent = next !== confirm ? 'Konfirmasi password belum sama.' : 'Password minimal 8 karakter.'; return; }
        var button = document.getElementById('btnReset'); button.disabled = true; button.textContent = 'Menyimpan...';
        sb.auth.updateUser({ password: next }).then(function (result) {
          if (result.error) throw result.error;
          msg.classList.add('text-[#16a34a]'); msg.textContent = 'Password berhasil diperbarui. Mengarahkan ke dashboard...';
          return sb.from('profiles').select('*').eq('id', result.data.user.id).maybeSingle();
        }).then(function (profileResult) { if (profileResult && profileResult.data) success(profileResult.data, profileResult.data); else location.href = 'login.html'; })
          .catch(function (error) { msg.classList.add('text-[#ef4444]'); msg.textContent = error.message; button.disabled = false; button.textContent = 'Simpan Password Baru'; });
      });

      var ROLE_UI = {
        mentee: { label: 'MENTEE', cls: 'bg-[#f97316]/10 text-[#f97316]', desc: 'Masuk untuk melanjutkan perjalanan fellowship-mu.' },
        mentor: { label: 'MENTOR', cls: 'bg-[#1a5f4f]/10 text-[#1a5f4f]', desc: 'Masuk untuk memantau & menilai mentee kamu.' },
        admin:  { label: 'PANITIA', cls: 'bg-[#8b5cf6]/10 text-[#8b5cf6]', desc: 'Masuk untuk memantau jalannya program secara keseluruhan.' }
      };
      function setRole(r) {
        role = ROLE_UI[r] ? r : 'mentee';
        var ui = ROLE_UI[role];
        badge.textContent = ui.label;
        badge.className = 'text-xs font-bold px-3 py-1 rounded-full ' + ui.cls;
        desc.textContent = ui.desc;
        // mode panitia: lewat tautan khusus — sembunyikan pilihan peran
        roleTabs.style.display = role === 'admin' ? 'none' : '';
        [['mentee', tabMentee], ['mentor', tabMentor]].forEach(function (p) {
          p[1].className = 'flex-1 py-2 rounded-lg text-xs ' + (p[0] === role ? 'font-bold bg-white shadow text-[#2c3e50]' : 'font-semibold text-slate-500');
        });
        email.value = '';
        password.value = '';
      }
      tabMentee.addEventListener('click', function () { setRole('mentee'); });
      tabMentor.addEventListener('click', function () { setRole('mentor'); });
      setRole(role);

      document.getElementById('togglePw').addEventListener('click', function () {
        var t = password.type === 'password';
        password.type = t ? 'text' : 'password';
        this.innerHTML = t ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
      });

      function fail(msg) {
        errMsg.querySelector('span').textContent = msg;
        errMsg.classList.remove('hidden');
        var card = document.getElementById('loginCard');
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        setBusy(false);
      }
      function setBusy(b) {
        var btn = document.getElementById('btnLogin');
        btn.disabled = b;
        btn.innerHTML = b ? '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Memeriksa...</span>'
                          : '<span>Masuk</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
      }
      function success(profile, authUser) {
        localStorage.setItem('ftgSession', JSON.stringify({
          id: authUser.id, email: authUser.email, name: profile.full_name, role: profile.role,
          initials: profile.initials, path: profile.path, menteeId: profile.mentee_number || null,
          cohortId: profile.cohort_id || null, mentorId: profile.mentor_id || null,
          at: new Date().toISOString()
        }));
        location.href = homeFor(profile.role);
      }

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        errMsg.classList.add('hidden');
        setBusy(true);
        var em = email.value.trim().toLowerCase();
        var pw = password.value;

        if (!sb) { fail('Layanan login sedang tidak tersedia. Coba beberapa saat lagi.'); return; }
        sb.auth.signInWithPassword({ email: em, password: pw }).then(function (result) {
          if (result.error || !result.data.user) throw result.error || new Error('Login gagal');
          return sb.from('profiles').select('*').eq('id', result.data.user.id).maybeSingle().then(function (profileResult) {
            if (profileResult.error || !profileResult.data) throw new Error('Profil akun belum disiapkan panitia.');
            if (profileResult.data.status !== 'active') {
              var inactiveMessage = profileResult.data.status === 'dropped' ? 'Status kepesertaan kamu telah dinyatakan gugur. Hubungi panitia bila memerlukan klarifikasi.' : 'Akun kamu sedang dikunci panitia. Hubungi panitia untuk membuka akses.';
              return sb.auth.signOut().then(function () { throw new Error(inactiveMessage); });
            }
            if (profileResult.data.role !== role) return sb.auth.signOut().then(function () { throw new Error('Akun ini terdaftar sebagai ' + profileResult.data.role + '. Pilih peran yang sesuai.'); });
            success(profileResult.data, result.data.user);
          });
        }).catch(function (error) {
          var message = error.message === 'Invalid login credentials' ? 'Email atau password salah.' : error.message;
          if (/banned/i.test(message || '')) message = 'Akun kamu sedang dikunci atau berstatus gugur. Hubungi panitia untuk informasi lebih lanjut.';
          fail(message);
        });
      });
      document.getElementById('forgotPw').addEventListener('click', function () {
        var em = email.value.trim().toLowerCase();
        if (!em) { fail('Isi email terlebih dahulu untuk menerima tautan reset.'); return; }
        if (!sb) { fail('Layanan reset password sedang tidak tersedia.'); return; }
        sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + '/login.html?reset=1' }).then(function (result) {
          if (result.error) throw result.error;
          errMsg.classList.remove('hidden'); errMsg.className = 'text-[#16a34a] text-xs font-semibold mb-3';
          errMsg.querySelector('span').textContent = 'Tautan reset sudah dikirim. Periksa email kamu.';
        }).catch(function (error) { fail(error.message); });
      });
    })();
  </script>
</body>
</html>
