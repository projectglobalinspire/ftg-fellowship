<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presensi — FTG Fellowship</title><link rel="stylesheet" href="responsive.css?v=61"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ftg-config.js?v=30"></script></head><body style="margin:0;background:#f1f5f9;font-family:Inter,Arial;color:#1e293b"><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section style="width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12);text-align:center"><div style="width:62px;height:62px;border-radius:18px;background:#e8f5ef;color:#1a5f4f;display:grid;place-items:center;font-size:28px;margin:auto">✓</div><h1 style="font-size:22px;margin:16px 0 6px">Presensi Kegiatan</h1><p id="attendanceStatus" style="font-size:13px;color:#64748b">Memeriksa sesi login dan QR...</p><button id="attendanceSubmit" class="ftg-suite-primary" style="width:100%;margin-top:14px;display:none">Konfirmasi Kehadiran</button><a id="attendanceLogin" href="login.html" class="ftg-suite-secondary" style="margin-top:14px;display:none">Login sebagai mentee</a></section></main><script>
(async function(){var status=document.getElementById('attendanceStatus'),submit=document.getElementById('attendanceSubmit'),login=document.getElementById('attendanceLogin'),token=new URLSearchParams(location.search).get('token');if(!token){status.textContent='QR presensi tidak valid.';return;}var client=supabase.createClient(FTG_CONF.url,FTG_CONF.anonKey),session=(await client.auth.getSession()).data.session;if(!session){status.textContent='Silakan login sebagai mentee, lalu buka kembali QR ini.';login.style.display='inline-flex';return;}var profile=await client.from('profiles').select('role,full_name,status').eq('id',session.user.id).maybeSingle();if(!profile.data||profile.data.role!=='mentee'||profile.data.status!=='active'){status.textContent='Presensi hanya dapat dilakukan oleh mentee aktif.';return;}status.textContent='Halo '+profile.data.full_name+'. Tekan tombol untuk mencatat kehadiranmu.';submit.style.display='inline-flex';submit.onclick=async function(){submit.disabled=true;submit.textContent='Mencatat...';var r=await fetch('/api/operations',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'check_in',token:token})}),data=await r.json();if(!r.ok){status.textContent=data.error||'Presensi gagal.';submit.disabled=false;submit.textContent='Coba lagi';return;}status.innerHTML='<b style="color:#15803d">Kehadiran berhasil tercatat.</b><br>'+data.session.title;submit.style.display='none';};})();
</script></body></html>
