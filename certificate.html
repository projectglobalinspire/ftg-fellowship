<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Sertifikat — FTG Fellowship</title><link rel="stylesheet" href="responsive.css?v=71"></head><body style="margin:0;background:#e8f5ef;font-family:Georgia,serif;color:#173b34"><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section id="certificate" style="width:min(900px,100%);box-sizing:border-box;background:#fff;border:12px double #1a5f4f;padding:54px;text-align:center;box-shadow:0 22px 70px rgba(15,23,42,.15)"><p style="font:800 12px Arial;letter-spacing:.18em;color:#f97316">FAITH TO GROW × GLOBAL INSPIRE</p><h1 style="font-size:42px;margin:20px 0 5px">Sertifikat Kelulusan</h1><p id="certificateStatus" style="font:14px Arial;color:#64748b">Memverifikasi sertifikat...</p><div id="certificateData"></div><button onclick="print()" class="ftg-suite-primary" style="margin-top:24px">Cetak / Simpan PDF</button></section></main><script>
(async function(){var code=new URLSearchParams(location.search).get('code')||'',s=document.getElementById('certificateStatus'),d=document.getElementById('certificateData');try{var r=await fetch('/api/certificates?code='+encodeURIComponent(code)),x=await r.json();if(!r.ok)throw new Error(x.error||'Tidak ditemukan');var c=x.certificate;s.innerHTML='<b style="color:#15803d">✓ Sertifikat sah dan terverifikasi</b>';d.innerHTML='<p style="margin-top:28px">Diberikan kepada</p><h2 style="font-size:34px;margin:8px">'+safe(c.recipient_name)+'</h2><p>atas kelulusan pada</p><h3 style="font-size:22px">'+safe(c.program_name)+'</h3><p style="font:12px Arial;color:#64748b;margin-top:25px">Nomor: '+safe(c.certificate_number)+' · Terbit '+new Date(c.issued_at).toLocaleDateString('id-ID',{dateStyle:'long'})+'</p><img alt="QR verifikasi" src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data='+encodeURIComponent(location.href)+'" style="width:130px;margin-top:18px">';}catch(e){s.innerHTML='<b style="color:#b91c1c">✕ Sertifikat tidak valid atau telah dicabut</b>';}})();function safe(v){var e=document.createElement('span');e.textContent=v||'';return e.innerHTML;}
</script><style>@media print{body{background:#fff}main{padding:0}#certificate{box-shadow:none;width:100%;height:100vh}button{display:none!important}}</style></body></html>
